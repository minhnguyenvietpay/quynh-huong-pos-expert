name: Offline response QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run qa:language
      - run: node qa-v3.js --self-test
      - run: npm run qa:legacy
      - name: Verify read-only dashboard QA
        run: node qa-v42-runner.js run
      - name: Ensure tracked files unchanged by QA
        run: git diff --exit-code
