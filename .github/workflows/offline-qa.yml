name: Offline response QA
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run qa:language
      - run: node qa-v3.js --self-test
      - run: npm run qa:legacy
      - name: Synthetic response contracts (private local report)
        run: |
          mkdir -p qa-reports
          node scripts/quality-report.cjs --output qa-reports/quality.json
      - name: V11 synthetic conversation regression (offline, flag enabled)
        env:
          QH_V11_ENABLED: 'true'
        run: node scripts/v11-evaluate.cjs --fail-on-regression > qa-reports/v11.json
      - name: Security policy checks (suppress paths in job logs)
        run: node scripts/security-check.cjs > qa-reports/security.json
      - name: Ensure tracked files unchanged by QA
        run: git diff --exit-code
