name: Daily knowledge review
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-knowledge-review
  cancel-in-progress: false
jobs:
  knowledge-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/knowledge-report.cjs
      - run: git diff --exit-code
